name: Build and Release Extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: ./extension
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        working-directory: ./extension
        run: npx playwright install --with-deps chromium

      - name: Build extension
        working-directory: ./extension
        run: npm run build

      - name: Run Integration Tests
        working-directory: ./extension
        run: npm run test:integration

      - name: Zip extension dist output
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'access-astrolabe-extension.zip'
          directory: 'extension/dist'

      - name: Upload zip asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: extension/dist/access-astrolabe-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
